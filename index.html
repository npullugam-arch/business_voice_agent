<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2563eb"><title>TailorConnect AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
</head>
<body class="user-portal">
  <div id="loading" class="screen center"><div class="spinner"></div><p>Loading…</p></div>
  <main id="access-view" class="screen center hidden"><section class="auth-card"><div class="brand-mark">✂</div><h1>Access required</h1><p>This device is not authorized to access Nandu Tailor customer information. Ask the shop owner to add this user as a shop member.</p><small>Device user ID</small><code id="member-user-id">Loading...</code></section></main>
  <div id="app" class="app-shell hidden">
    <aside class="sidebar"><div class="logo">✂ <span>TailorConnect</span></div><nav id="side-nav"></nav></aside>
    <div class="content"><header class="topbar"><div><small id="shop-name"></small><h1 id="page-title">Welcome!</h1></div><button id="add-top" class="btn primary">＋ Add customer</button></header><section id="page" class="page"></section></div>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><button id="modal-close" class="icon-button" aria-label="Close">×</button><div id="modal-body"></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" onerror="window.__supabaseLoadFailed=true"></script>
  <script src="js/config.js"></script>
  <script>window.__appStartupTimer=setTimeout(function(){var l=document.getElementById('loading');if(l&&!l.classList.contains('hidden')){l.innerHTML='<section class="auth-card"><div class="brand-mark">!</div><h1>App could not start</h1><p>Check the browser console and your Supabase configuration, then refresh the page.</p></section>'}},8000);</script>
  <script type="module" src="js/app.js"></script>
</body></html>
