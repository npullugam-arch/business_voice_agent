<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172033"><title>TailorConnect Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/global.css"><link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-portal">
  <div id="loading" class="screen center hidden"><div class="spinner"></div><p>Opening admin portal…</p></div>
  <main id="admin-login-view" class="admin-login-screen">
    <form id="admin-login-form" class="admin-login-card">
      <div class="admin-login-mark">✂</div><span class="admin-eyebrow">NANDU TAILOR</span>
      <h1>Admin Portal</h1><p>Sign in to manage customers, calls, collections and AI automation.</p>
      <label>Username<input name="username" autocomplete="username" required placeholder="Enter admin username"></label>
      <label>Password<div class="password-field"><input name="password" type="password" autocomplete="current-password" required placeholder="Enter password"><button id="toggle-password" type="button" aria-label="Show password">Show</button></div></label>
      <p id="admin-login-error" class="admin-login-error hidden" role="alert"></p>
      <button class="btn primary full" type="submit">Sign In</button>
      <a class="back-to-shop" href="/">← Back to shop dashboard</a>
    </form>
  </main>
  <main id="access-view" class="screen center hidden"><section class="auth-card"><div class="brand-mark">!</div><h1>Could not open admin portal</h1><p>Please refresh and try again.</p><small>Device user ID</small><code id="member-user-id">Unavailable</code></section></main>
  <div id="app" class="app-shell hidden">
    <aside class="sidebar"><div class="logo">✂ <span>TailorConnect</span><em>ADMIN</em></div><nav id="side-nav"></nav><button id="admin-logout" class="nav-button admin-logout"><b>↪</b><span>Admin Logout</span></button></aside>
    <div class="content"><header class="topbar"><div><small id="shop-name"></small><h1 id="page-title">Admin Overview</h1></div><button id="add-top" class="btn primary">＋ Add customer</button></header><section id="page" class="page"></section></div>
    <nav id="bottom-nav" class="bottom-nav"></nav>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card"><button id="modal-close" class="icon-button" aria-label="Close">×</button><div id="modal-body"></div></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script><script type="module" src="/js/admin.js"></script>
</body></html>
